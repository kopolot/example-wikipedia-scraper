services:
  app:
    working_dir: /app
    build:
      context: .
      dockerfile: ./docker/golang/api/Dockerfile.prod
    networks:
      - app_network
    depends_on:
      - db
    restart: always

  scraper:
    working_dir: /app
    build:
      context: .
      dockerfile: ./docker/golang/scraper/Dockerfile.prod
    volumes:
      - ./app/resource:/app/resource:ro
    networks:
      - app_network
    depends_on:
      - db
      - rabbitmq
    restart: always
    shm_size: "1gb"

  db:
    image: postgres:17
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: user
      POSTGRES_DB: db
    networks:
      - app_network

  adminer:
    image: adminer
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/certs:/etc/nginx/certs
    networks:
      - app_network

  frontend:
    image: node:lts-alpine
    restart: always
    networks:
      - app_network
    hostname: frontend

  rabbitmq:
    image: rabbitmq:4.2.4-management-alpine
    restart: always
    networks:
      - app_network
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password

  mailhog:
    image: mailhog/mailhog
    hostname: mailhog
    restart: always
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    ipam:
      config:
        - subnet: 172.100.100.0/24
          gateway: 172.100.100.1
