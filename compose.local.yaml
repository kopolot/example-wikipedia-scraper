services:
  app:
    image: golang:1.25-alpine
    volumes:
      - ./app:/app
    ports:
      - "52445:2345" # Port dla debuggera
      - "52446:2346" # Port dla aplikacji
    build:
      context: .
      dockerfile: ./docker/golang/api/Dockerfile.local
    restart: always
    security_opt:
      - "apparmor:unconfined"
    cap_add:
      - SYS_PTRACE # Umożliwia użycie ptrace, co jest wymagane dla debuggera

  scraper:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./app:/app
    build:
      context: .
      dockerfile: ./docker/golang/scraper/Dockerfile.local
    command: sh -c "go mod tidy && bin/hotreload_scraper.sh"
    restart: always
    depends_on:
      - db
      - rabbitmq
    shm_size: "1gb"

  frontend:
    image: node:lts-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - /usr/share/code/resources/app:/usr/share/code/resources/app:ro
      - ./frontend:/app
    ports:
      - "3000:3000"
      - "9229:9229" # Port dla debuggera Node.js
